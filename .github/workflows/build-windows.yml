name: build-windows

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Wdrozyciel.exe
        shell: cmd
        run: call "src\build.cmd"

      - name: Sign (optional)
        if: ${{ env.SIGN_PFX_BASE64 != '' }}
        shell: pwsh
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}
          SIGN_PFX_PASSWORD: ${{ secrets.SIGN_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'sign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGN_PFX_BASE64))
          $env:SIGN_PFX = $pfx
          & "src\build.cmd"
          Remove-Item $pfx -Force

      - name: Verify artifact exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'Wdrozyciel.exe')) { throw 'Build nie wyprodukował Wdrozyciel.exe' }
          Get-Item 'Wdrozyciel.exe' | Select-Object Name, Length, LastWriteTime

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wdrozyciel-exe
          path: |
            Wdrozyciel.exe
            apps.json
            winget-remove-defaults.txt
            appx-remove-defaults.txt
            scripts/**
            tools/**
          if-no-files-found: error

      - name: Publish Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Wdrozyciel.exe
          generate_release_notes: true
